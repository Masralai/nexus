name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:compile
      - run: cp dist/nexus nexus-linux-amd64
      - name: Read parity pin
        run: echo "PARITY_PIN=$(jq -r '.pin.implementation + \" \" + .pin.version + \" (\" + .pin.commit + \")\"' fixtures/parity/read-file.json)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: nexus-linux-amd64
          body: |
            Parity reference: ${{ env.PARITY_PIN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
